<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>X3D Rigid Body Physics Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            color: #61443e;
            font-family: monospace;
            font-size: 13px;
            text-align: center;
            background-color: #bfd1e5;
            margin: 0px;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 10px; 
            width: 100%;
            padding: 5px;
            pointer-events: none;
        }
        x3d-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            border: none;
        }
    </style>
    <!-- Include X_ITE library for declarative X3D JSON rendering -->
    <script defer src="https://cdn.jsdelivr.net/npm/x_ite@14.0.6/dist/x_ite.min.js"></script>
</head>
<body>
    <div id="info">
        X3D Rigid Body Physics Demo (Driven via JSON)<br>
        <strong>Press 'Q' or 'A'</strong> to apply mechanical torque to the arm.
    </div>
    
    <x3d-canvas src="scene.json" class="x3d-canvas"></x3d-canvas>

    <script src="index.js"></script>
</body>
</html>
